<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary meta -->
    <title>notefall — Free Piano Visualizer and MIDI Video Maker</title>
    <meta
      name="description"
      content="Make piano videos from MIDI in your browser. Notes are rendered in 3D with realistic reflections and textures like metal, water or glass. Record and edit MIDI, and export video up to 4K at 60 fps. Free, no watermark."
    />
    <meta
      name="keywords"
      content="piano visualizer, MIDI visualizer, MIDI to video, piano video maker, MIDI editor, MIDI recorder, falling notes"
    />
    <meta name="theme-color" content="#05060a" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://notefall.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="notefall" />
    <meta property="og:title" content="notefall — Free Piano Visualizer and MIDI Video Maker" />
    <meta
      property="og:description"
      content="Make piano videos from MIDI in your browser. Notes are rendered in 3D with realistic reflections and textures like metal, water or glass. Record and edit MIDI, and export video up to 4K at 60 fps. Free, no watermark."
    />
    <meta property="og:url" content="https://notefall.app/" />
    <meta property="og:image" content="https://notefall.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A beautiful piano visualization: clear, ice-like notes with bright reflections fall onto a 3D piano keyboard, and particles drift up like smoke from a glowing blue hit line. Beside them are the notefall logo and the line “Load a MIDI, fix the notes, export the video. Free, no sign-up.”"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="notefall — Free Piano Visualizer and MIDI Video Maker" />
    <meta
      name="twitter:description"
      content="Make piano videos from MIDI in your browser. Notes are rendered in 3D with realistic reflections and textures like metal, water or glass. Record and edit MIDI, and export video up to 4K at 60 fps. Free, no watermark."
    />
    <meta name="twitter:image" content="https://notefall.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="A beautiful piano visualization: clear, ice-like notes with bright reflections fall onto a 3D piano keyboard, and particles drift up like smoke from a glowing blue hit line. Beside them are the notefall logo and the line “Load a MIDI, fix the notes, export the video. Free, no sign-up.”"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "notefall",
        "url": "https://notefall.app/",
        "description": "A free piano visualizer and MIDI video maker that runs in the browser. Notes fall onto a 3D keyboard, rendered with realistic reflections and textures such as metal, water, ice or glass, and particles drift up from them like smoke. Record from a MIDI keyboard, edit notes on screen, save as MIDI, and export video up to 4K at 60 fps. Files are processed in the browser and never uploaded.",
        "featureList": [
          "Notes rendered in 3D, with realistic reflections and textures such as metal, water, ice and glass",
          "Particles that drift up from each note like smoke",
          "Note colors by track, hand, gradient or random palette",
          "Keyframes that change colors, camera and background during the song",
          "Recording from a MIDI keyboard, with velocity and sustain pedal",
          "Note editing on screen, and saving as a MIDI file",
          "Video export up to 4K at 60 fps (MP4 or WebM), no watermark"
        ],
        "isAccessibleForFree": true,
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web browser",
        "browserRequirements": "Requires WebGL and a viewport at least 1024px wide.",
        "image": "https://notefall.app/og-image.png",
        "inLanguage": ["en", "ja"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body class="bg-neutral-950">
    <div id="root"></div>
    <noscript>
      <p>
        notefall is a free piano visualizer and MIDI video maker. Notes are rendered in 3D with realistic

        at 60 fps. It needs JavaScript and WebGL.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
